name: Hanako Linux x86_64.

# Two jobs so each gets the full 6h GitHub-hosted limit:
#   env:   builds the official-style Rocky Linux 8 library image
#          (Telegram/build/docker/centos_env) and pushes it to GHCR,
#          tagged by a hash of that directory, with a registry layer cache.
#          Skipped when the tag already exists.
#   build: runs build.sh inside that image (Release) and packs a tarball.

on:
  push:
    branches: [hanako]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'snap/**'
      - 'Telegram/Resources/winrc/**'
      - 'Telegram/SourceFiles/platform/win/**'
      - 'Telegram/SourceFiles/platform/mac/**'
      - 'Telegram/build/setup.iss'
      - '.github/workflows/win.yml'
  workflow_dispatch:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:

  env:
    name: Library image (Rocky Linux 8)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - name: Clone.
        uses: actions/checkout@v7

      - name: Image tag.
        id: tag
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          HASH=$(find Telegram/build/docker/centos_env -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-16)
          echo "image=ghcr.io/$OWNER/hanakodesktop-env:centos-$HASH" >> $GITHUB_OUTPUT
          echo "cache=ghcr.io/$OWNER/hanakodesktop-env:buildcache" >> $GITHUB_OUTPUT

      - name: Log in to GHCR.
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for an existing image.
        id: exists
        run: |
          if docker manifest inspect ${{ steps.tag.outputs.image }} >/dev/null 2>&1; then
            echo "found=true" >> $GITHUB_OUTPUT; echo "Image already built."
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate Dockerfile (Release libraries, no LTO).
        if: steps.exists.outputs.found != 'true'
        run: |
          python3 -m pip install --user jinja2
          cd Telegram/build/docker/centos_env
          DEBUG= LTO= python3 gen_dockerfile.py > Dockerfile
          rm -rf __pycache__

      - name: Free up some disk space.
        if: steps.exists.outputs.found != 'true'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true

      - name: Set up Docker Buildx.
        if: steps.exists.outputs.found != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and push library image.
        if: steps.exists.outputs.found != 'true'
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: Telegram/build/docker/centos_env
          push: true
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=registry,ref=${{ steps.tag.outputs.cache }}
          cache-to: type=registry,ref=${{ steps.tag.outputs.cache }},mode=max

  build:
    name: Hanako (x86_64 Release)
    needs: env
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CCACHE_DIR: ${{ github.workspace }}/../.ccache
    steps:
      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Free up some disk space.
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true

      - name: Log in to GHCR.
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull library image.
        run: docker pull ${{ needs.env.outputs.image }}

      - name: Restore ccache.
        id: ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: linux-ccache-${{ github.run_id }}
          restore-keys: linux-ccache-

      - name: Hanako build.
        env:
          API_ID: ${{ secrets.TDESKTOP_API_ID }}
          API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          mkdir -p "$CCACHE_DIR"
          if [ -n "$API_ID" ]; then API="-D TDESKTOP_API_ID=$API_ID -D TDESKTOP_API_HASH=$API_HASH"; else API="-D TDESKTOP_API_TEST=ON"; fi
          docker run --rm \
            -u $(id -u) \
            -v $PWD:/usr/src/tdesktop \
            -v "$CCACHE_DIR":/var/cache/ccache \
            -e CONFIG=Release \
            -e KEEP_GOING=1 \
            -e CCACHE_SLOPPINESS=pch_defines,time_macros \
            -e CCACHE_MAXSIZE=2G \
            ${{ needs.env.outputs.image }} \
            env -u CCACHE_DISABLE /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
            -D CMAKE_CONFIGURATION_TYPES=Release \
            $API \
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

      - name: Save ccache.
        if: always() && steps.ccache.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: linux-ccache-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Pack tarball.
        run: |
          BIN=$(find out -type f -name Hanako -perm -u+x | head -1)
          echo "binary: $BIN"; test -n "$BIN"
          ls -la "$BIN"; file "$BIN"
          VER=$(grep '^AppVersionStr ' Telegram/build/version | awk '{print $2}')
          NAME=Hanako-$VER-${GITHUB_SHA::7}-linux-x86_64
          mkdir -p pkg/Hanako
          cp "$BIN" pkg/Hanako/Hanako
          tar -cJf $NAME.tar.xz -C pkg Hanako
          echo "TARBALL=$NAME.tar.xz" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v7
        with:
          name: Hanako-linux-x86_64
          path: ${{ env.TARBALL }}
          retention-days: 30
